<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mis Notas</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0f0f0f;
    color: #eaeaea;
  }

  header {
    padding: 15px;
    background: #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  h1 {
    font-size: 18px;
    margin: 0;
  }

  .container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 120px;
    background: #1f1f1f;
    color: white;
    border: 1px solid #333;
    padding: 10px;
    border-radius: 8px;
    resize: none;
  }

  button {
    margin-top: 10px;
    padding: 10px 15px;
    background: #3b82f6;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover {
    background: #2563eb;
  }

  .note {
    background: #1a1a1a;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .note p {
    margin: 0;
    white-space: pre-wrap;
  }

  .delete {
    background: #ef4444;
    border: none;
    color: white;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete:hover {
    background: #dc2626;
  }
</style>
</head>

<body>
<header>
  <h1>📝 Mis Notas</h1>
</header>

<div class="container">
  <textarea id="noteInput" placeholder="Escribe una nota..."></textarea>
  <button onclick="addNote()">Guardar nota</button>

  <div id="notesList"></div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function saveNotes() {
  localStorage.setItem("notes", JSON.stringify(notes));
}

function addNote() {
  const input = document.getElementById("noteInput");
  const text = input.value.trim();

  if (!text) return;

  notes.unshift({
    id: Date.now(),
    text
  });

  input.value = "";
  saveNotes();
  renderNotes();
}

function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  saveNotes();
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById("notesList");
  list.innerHTML = "";

  notes.forEach(note => {
    const div = document.createElement("div");
    div.className = "note";

    div.innerHTML = `
      <p>${escapeHtml(note.text)}</p>
      <button class="delete" onclick="deleteNote(${note.id})">X</button>
    `;

    list.appendChild(div);
  });
}

function escapeHtml(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

renderNotes();
</script>
</body>
</html>
